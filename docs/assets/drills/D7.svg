<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D7: Double pivot under pressure</title><desc id="desc">Setup: ten players in a 30x22 rectangle: two near-end center-back targets, two far-end attacking targets, two pivots inside, and four defenders inside. Targets support possession from their end lines. The six possession players face four defenders. Example: Six possession players include four end-line targets and two live pivots. Example: near target → 6 → 8 → far target. Turn, set or go around pressure. After a far-target reception, reverse direction; defenders counter across an end.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D7  ·  Double pivot under pressure</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">10 players  ·  30 × 22 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><text x="213.0" y="173.0" fill="#62795b" font-size="14" text-anchor="middle" font-weight="600">Near targets</text><text x="778.8" y="173.0" fill="#62795b" font-size="14" text-anchor="middle" font-weight="600">Far targets</text><path d="M147.39999999999998,491.25L333.56832857763266,441.8226871535503" stroke="#236d53" stroke-width="3.5"/><path d="M344.2,439.0L333.8848526090312,446.9118729958582L331.318773378531,437.24671715734246Z" fill="#236d53"/><circle cx="245.79999999999998" cy="456.125" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="245.8" y="460.1" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">1</text><path d="M409.79999999999995,424.75L525.748107704043,285.94220439495655" stroke="#236d53" stroke-width="3.5"/><path d="M532.8,277.5L528.9443922203,289.91508311084215L521.2696609521577,283.50427193269945Z" fill="#236d53"/><circle cx="471.29999999999995" cy="342.125" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="471.3" y="346.1" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">2</text><path d="M598.4,263.25L841.617243253437,249.61567381447097" stroke="#236d53" stroke-width="3.5"/><path d="M852.5999999999999,249.0L840.8986625557817,254.6638063187697L840.3389590880807,244.67948200371242Z" fill="#236d53"/><circle cx="725.5" cy="247.125" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="725.5" y="251.1" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">3</text><g class="player" data-group="A"><circle cx="114.6" cy="258.5" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="114.6" y="263.5" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">4</text></g><g class="player" data-group="A"><circle cx="114.6" cy="500.75" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="114.6" y="505.8" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">5</text></g><g class="player" data-group="A"><circle cx="377.0" cy="434.25" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="377.0" y="439.2" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">6</text></g><g class="player" data-group="A"><circle cx="565.5999999999999" cy="263.25" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="565.6" y="268.2" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">8</text></g><g class="player" data-group="A"><circle cx="885.4" cy="249.0" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="885.4" y="254.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">10</text></g><g class="player" data-group="A"><circle cx="885.4" cy="500.75" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="885.4" y="505.8" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">9</text></g><g class="player" data-group="B"><circle cx="327.79999999999995" cy="287.0" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="327.8" y="292.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D1</text></g><g class="player" data-group="B"><circle cx="499.99999999999994" cy="367.75" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="500.0" y="372.8" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D2</text></g><g class="player" data-group="B"><circle cx="647.5999999999999" cy="458.0" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="647.6" y="463.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D3</text></g><g class="player" data-group="B"><circle cx="746.0" cy="315.5" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="746.0" y="320.5" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D4</text></g><g><circle cx="180.2" cy="486.5" r="7" fill="#fff" stroke="#284b38" stroke-width="2"/><circle cx="180.2" cy="486.5" r="2.2" fill="#284b38"/></g><circle cx="56" cy="665" r="8" fill="#195640"/><text x="71.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Possession / team A</text><circle cx="296" cy="665" r="8" fill="#b7543d"/><text x="311.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Opposition / team B</text><circle cx="536" cy="665" r="8" fill="#d3a438"/><text x="551.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Neutral / server</text><circle cx="776" cy="665" r="8" fill="#d7ded5"/><text x="791.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Rest / observer</text><path d="M48 698H88" stroke="#236d53" stroke-width="3"/><path d="M95 698L86 693V703Z" fill="#236d53"/><path d="M232 698h8m6 0h8m6 0h8" stroke="#986a15" stroke-width="3"/><path d="M280 698L271 693V703Z" fill="#986a15"/><path d="M424 698H465" stroke="#a34534" stroke-width="3"/><path d="M472 698L463 693V703Z" fill="#a34534"/><text x="105.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Pass</text><text x="290.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Player run</text><text x="482.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Shot / service</text><text x="659.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Orange cones = gate</text><rect x="36" y="725" width="928" height="46" rx="9" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">One pivot connects underneath while the other offers beyond.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Six possession players include four end-line targets and two live pivots.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Example: near target → 6 → 8 → far target. Turn, set or go around pressure.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">After a far-target reception, reverse direction; defenders counter across an end.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>