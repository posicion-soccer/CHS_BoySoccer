<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D8: Find the attacking midfielder between lines</title><desc id="desc">Setup: fourteen players in a 45x36 area split into three horizontal thirds. Two teams of six plus two neutral end targets outside opposite end lines. Each team starts with two players in each third. One player per team may move into an adjacent third to support, then returns when the ball leaves that zone. The end targets support the attacking team. Example: Two teams of six start with two players in each third; two neutral end targets help possession. Find a controlled middle-third reception before reaching the far target. One teammate may support into an adjacent third, then returns when the ball leaves.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D8  ·  Find the attacking midfielder between lines</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">14 players  ·  45 × 36 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M363.306 135V610" stroke="#9cb58f" stroke-width="2" stroke-dasharray="8 7"/><path d="M636.694 135V610" stroke="#9cb58f" stroke-width="2" stroke-dasharray="8 7"/><text 