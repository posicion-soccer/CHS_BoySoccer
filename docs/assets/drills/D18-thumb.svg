<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D18: Goalkeeper actions connected to team play</title><desc id="desc">Setup: six players in a 30x25 area: keeper, two servers, two wide outlets and one active forward. Use the main goal and two three-yard outlet gates. Place a second keeper as observer if available, swapping each block. Example: Keeper secures a manageable shot or pass from one of two servers. Scan and distribute to the free wide outlet while F presses the distribution. The outlet returns by foot. Keeper changes side or uses a longer gate exit.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D18  ·  Goalkeeper actions connected to team play</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">6 players  ·  30 × 25 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M90 234H227V511H90 M90 310H136V435H90" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="67" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><path d="M893.5999999999999 177.75L893.5999999999999 234.75" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M886.5999999999999,183.75L893.5