<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D19: Throw in with three solutions</title><desc id="desc">Setup: eight players in a 24x18 area beside a real touchline: thrower, three teammates and four defenders. Put an exit gate at each end. Start defenders two yards from receivers, then let them mark freely. Coach holds spare balls outside the field. Example: Thrower has three teammates: one checks short, one supports inside, one threatens behind. Shown: short throw, then a set or return option as the thrower re-enters play. Four defenders mark live; retain three actions or exit a gate, then rotate thrower.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D19  ·  Throw in with three solutions</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">8 players  ·  24 × 18 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M98.2 477.0L98.2 548.25" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M91.2,483.0L98.2,469.0L105.2,483.0Z" fill="#d18c34" stroke="#915b19"/><path d="M91.2,554.25L98.2,540.25L105.2,554.25Z" fill="#d18c34" stroke="#915b19"/><path d="M901.8 477.0L901.8 548.25" stroke="#e7a554" s