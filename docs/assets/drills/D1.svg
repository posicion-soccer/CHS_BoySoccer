<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D1: Scan receive and escape</title><desc id="desc">Setup: four players per 14x12 area: server, receiver, defender and target. Mark two two-yard gates on the far end. Server starts at the near end, receiver centrally, defender two yards behind receiver, target beyond the gates. Use one active ball and spare balls beside the server. Example: S serves to R; R checks both shoulders before receiving. Example: escape through the lower gate, then find target T. If the turn is blocked, set to S instead. Rotate every four attacks.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D1  ·  Scan receive and escape</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">4 players  ·  14 × 12 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M885.4 239.5L885.4 296.5" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M878.4,245.5L885.4,231.5L892.4,245.5Z" fill="#d18c34" stroke="#915b19"/><path d="M878.4,302.5L885.4,288.5L892.4,302.5Z" fill="#d18c34" stroke="#915b19"/><path d="M885.4 467.5L885.4 524.5" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d