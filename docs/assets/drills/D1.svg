rcle cx="56" cy="665" r="8" fill="#195640"/><text x="71.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Possession / team A</text><circle cx="296" cy="665" r="8" fill="#b7543d"/><text x="311.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Opposition / team B</text><circle cx="536" cy="665" r="8" fill="#d3a438"/><text x="551.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Neutral / server</text><circle cx="776" cy="665" r="8" fill="#d7ded5"/><text x="791.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Rest / observer</text><path d="M48 698H88" stroke="#236d53" stroke-width="3"/><path d="M95 698L86 693V703Z" fill="#236d53"/><path d="M232 698h8m6 0h8m6 0h8" stroke="#986a15" stroke-width="3"/><path d="M280 698L271 693V703Z" fill="#986a15"/><path d="M424 698H465" stroke="#a34534" stroke-width="3"/><path d="M472 698L463 693V703Z" fill="#a34534"/><text x="105.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Pass</text><text x="290.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Player run</text><text x="482.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Shot / service</text><text x="659.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Orange cones = gate</text><rect x="36" y="725" width="928" height="46" rx="9" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">Scan the pressure; a useful set is as valuable as a turn.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">S serves to R; R checks both shoulders before receiving.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Example: escape through the lower gate, then find target T.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">If the turn is blocked, set to S instead. Rotate every four attacks.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>