<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D20: Restarts with a live second phase</title><desc id="desc">Setup: sixteen players in a 40x55 final-third area: one keeper, seven attacking players and eight defending players. On corners, designate one taker, four box attackers and two short or edge players. Defenders include assigned markers and two counter outlets. Use two mini-goals near halfway. Example: Corner picture: taker, four box attackers, two short/edge players against eight defenders plus GK. Play the delivery, then the clearance and live second phase. Two defensive outlets counter to mini-goals; attackers protect the middle and recover.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D20  ·  Restarts with a live second phase</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">16 players  ·  40 × 55 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M910 234H773V511H910 M910 310H864V435H910" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="910" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><rect x="74" y="205.0" width="16" height="50" fill="#fff" stroke="#