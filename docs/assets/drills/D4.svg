<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D4: Third player with a live decision</title><desc id="desc">Setup: five players in a 22x16 area: A at near end, B inside, C beyond, two defenders centrally. Put two three-yard target gates on the far line. A, B and C attack; defenders counter over the near line. Example: A feeds B while C changes angle beyond the first defender. Example: B releases C, who carries through a target gate. B can also turn or set; A may play C directly when the lane opens.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D4  ·  Third player with a live decision</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">5 players  ·  22 × 16 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M893.5999999999999 249.0L893.5999999999999 306.0" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M886.5999999999999,255.0L893.5999999999999,241.0L900.5999999999999,255.0Z" fill="#d18c34" stroke="#915b19"/><path d="M886.5999999999999,312.0L893.5999999999999,298.0L900.5999999999999,312.0Z" fill="#d18c34" stroke="#915b19"/><path d="M893.5999999999999 472.25L893.5999999999999 529.25" stro