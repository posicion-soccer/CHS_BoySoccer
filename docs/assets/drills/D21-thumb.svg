" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">Does the coached idea survive when players are free to choose?</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Eleven versus eleven: our 4-2-3-1 faces an example 4-3-3 (adapt to the next opponent).</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Illustrated build-out is one option. Play normal rules and realistic restarts.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Observe one theme, let the sequence finish, then use one intervention and replay.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>