<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D21: Full team game with an observation focus</title><desc id="desc">Setup: 22 players on a full field, two goalkeepers and two teams of ten outfield players. Our team uses the 4-2-3-1. The opponent uses the likely next opponent&#x27;s shape. With 18-20 players, use 9v9 or 10v10 including keepers and explicitly identify which full-team relationships are absent. Example: Eleven versus eleven: our 4-2-3-1 faces an example 4-3-3 (adapt to the next opponent). Illustrated build-out is one option. Play normal rules and realistic restarts. Observe one theme, let the sequence finish, then use one intervention and replay.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D21  ·  Full team game with an observation focus</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">22 players  ·  Full field  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><g fill="none" stroke="#b1c2a5" stroke-width="2"><path d="M500 135V610 M90 244H206V501H90 M910 244H794V501H910"/><circle cx="500" cy="372" r="66"/></g><rect x="67" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><r