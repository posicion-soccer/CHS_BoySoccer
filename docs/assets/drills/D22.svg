<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D22: Score and clock challenge</title><desc id="desc">Setup: fourteen players in a 55x40 area: two keepers and two teams of six outfield players. Use full-size goals when available. Have score cards or a visible board and a clear running clock. Explain whether practice time is running or stopped; actual competition clock rules may differ. Example: Two teams of six outfield players plus keepers play to two full-size goals. Start a four-minute game: level, leading by one, or trailing by one. Reset score and roles between games; later remove one outfielder to model disadvantage.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D22  ·  Score and clock challenge</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">14 players  ·  55 × 40 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><g fill="none" stroke="#b1c2a5" stroke-width="2"><path d="M500 135V610 M90 244H206V501H90 M910 244H794V501H910"/><circle cx="500" cy="372" r="66"/></g><rect x="67" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><rect x="910" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><text x="491.8" y="168.2" fill="#62795b" font-size="14" text-anchor="middle" font-weight="600">EXAMPLE: LEVEL · 4:00</text><path d="M327.79999999999995,500.75L431.6837770448669,487.8550189643785" stroke="#236d53" stroke-width="3.5"/><path d="M442.59999999999997,486.5L431.3073108509359,492.9401220316552L430.07547542877364,483.0162829815342Z" fill="#236d53"/><circle cx="385.19999999999993" cy="484.625" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="385.2" y="488.6" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">1</text><path d="M508.2,472.25L645.3288674807196,428.1197750316112" stroke="#236d53" stroke-width="3.5"/><path d="M655.8,424.75L645.9086622660628,433.18572390688513L642.8452304191436,423.6665125257212Z" fill="#236d53"/><circle cx="582.0" cy="439.5" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="582.0" y="443.5" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">2</text><path d="M721.4,405.75L850.187246667702,370.64300306045425" stroke="#a34534" stroke-width="3.5"/><path d="M860.8,367.75L850.537452301336,375.72998212608553L847.9074495191047,366.08202455126917Z" fill="#a34534"/><circle cx="791.0999999999999" cy="377.75" r="11" fill="#fbfcf7" stroke="#a34534"/><text x="791.1" y="381.8" fill="#a34534" font-size="13" text-anchor="middle" font-weight="700">3</text><g class="player" data-group="A"><circle cx="131.0" cy="372.5" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="131.0" y="377.5" fill="#fff" font-size="12" text-anchor="middle" font-weight="700">GK1</text></g><g class="player" data-group="A"><circle cx="286.79999999999995" cy="244.25" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="286.8" y="249.2" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">A1</text></g><g class="player" data-group="A"><circle cx="286.79999999999995" cy="505.5" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="286.8" y="510.5" fill="#fff"