<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D14: Delay recover and protect the middle</title><desc id="desc">Setup: nine players on a 45x35 area with a full-size goal: keeper, three recovering defenders, four attackers and one resting defender who rotates. Mark two wide starting gates near halfway. Three attackers begin against two defenders; a fourth attacker and third defender recover from five yards behind the play. Example: Three attackers begin against two defenders; a fourth attacker and third defender recover. The first defender delays and steers away from the center. Recovery restores cover. End after a shot, controlled exit or 15 seconds, then reset.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D14  ·  Delay recover and protect the middle</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">9 players  ·  45 × 35 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M910 234H773V511H910 M910 310H864V435H910" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="910" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><path d="M98.2 173.0L98.2 234.75" stroke="#e7a554" st