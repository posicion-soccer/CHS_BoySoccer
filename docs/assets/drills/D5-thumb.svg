<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D5: Attract pressure and switch</title><desc id="desc">Setup: twelve players, three teams of four, in a 36x24 area split into three 12x24 zones. Team A begins in the left zone, B in the right, C defends. Two C players press the ball zone; two occupy the middle to intercept. Place balls by the coach. Example: A circulates against two pressers; two more defenders screen the middle. Switch to B through an open ground lane or a controlled lofted pass. Two C players press the new zone; rotate pressing and screening duties.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D5  ·  Attract pressure and switch</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">12 players  ·  36 × 24 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M363.306 135V610" stroke="#9cb58f" stroke-width="2" stroke-dasharray="8 7"/><path d="M636.694 135V610" stroke="#9cb58f" stroke-width="2" stroke-dasharray="8 7"/><text x="221.2" y="168.2" fill="#62795b" font-size="14" text-anchor="middle" font-weight="600">A: 4 players</text><text x="500.0" y="168.2" fill="#62795b" font-size="14" text-anchor="