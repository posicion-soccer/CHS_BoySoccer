<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D12: Winger duel with inside and outside choices</title><desc id="desc">Setup: six players in a 22x18 channel: two attackers, two defenders and two targets. Mark an outside exit gate and an inside exit gate on the far line. One attacker faces one defender; two targets wait beyond the gates. The spare pair rests behind the start line. Example: One attacker duels one defender; two targets wait beyond the inside and outside gates. A member of the spare pair serves; beat the defender and find either target. Defender can win and exit the near line. Reset after about ten seconds and rotate.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D12  ·  Winger duel with inside and outside choices</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">6 players  ·  22 × 18 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M893.5999999999999 220.5L893.5999999999999 287.0" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M886.5999999999999,226.5L893.5999999999999,212.5L900.5999999999999,226.5Z" fill="#d18c34" stroke="#915b19"/><path d="M886.5999999999999,293.0L8