<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D6: Build out against a real press</title><desc id="desc">Setup: fourteen players on a 55x50 half-field area: goalkeeper, back four, two pivots and one target 10 build against six pressers. Use the main goal and three three-yard target gates on the halfway edge. Target 10 operates near that edge. Six pressers use two forwards, three midfielders and one covering defender. Example: GK, back four, two pivots and target 10 build against six pressers. Illustrated route: GK → 4 → 8 → 10; other useful exits remain available. Builders exit to 10 or a gate. Pressers who regain attack the main goal.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D6  ·  Build out against a real press</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">14 players  ·  55 × 50 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M90 234H227V511H90 M90 310H136V435H90" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="67" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><path d="M901.8 163.5L901.8 215.75" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5