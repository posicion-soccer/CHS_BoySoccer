<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D13: Hunt or Home after a loss</title><desc id="desc">Setup: twelve players in a 32x26 area: two teams of five and two neutrals playing with possession. Put a mini-goal outside each end. Neutrals remain inside and change allegiance immediately when possession changes. Example: Two teams of five plus two neutrals retain for five passes = one point. Picture: B3 intercepts. Nearby A players Hunt with cover or drop Home. The team that regains can score in either mini-goal within six seconds for two points.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D13  ·  Hunt or Home after a loss</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">12 players  ·  32 × 26 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><rect x="74" y="347.5" width="16" height="50" fill="#fff" stroke="#667c65" stroke-width="3"/><text x="68.0" y="420.5" fill="#183c2e" font-size="12" text-anchor="middle" font-weight="400">mini</text><rect x="910" y="347.5" width="16" height="50" fill="#fff" stroke="#667c65" stroke-width="3"/><text x="932.0" y="420.5" fill="#183c2e" font-size="12" text-anchor="middle" fo