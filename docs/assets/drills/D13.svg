<circle cx="139.2" cy="538.75" r="18" fill="#d3a438" stroke="#fff" stroke-width="2.5"/><text x="139.2" y="543.8" fill="#183c2e" font-size="14" text-anchor="middle" font-weight="700">N1</text></g><g class="player" data-group="N"><circle cx="836.1999999999999" cy="239.5" r="18" fill="#d3a438" stroke="#fff" stroke-width="2.5"/><text x="836.2" y="244.5" fill="#183c2e" font-size="14" text-anchor="middle" font-weight="700">N2</text></g><g><circle cx="557.4" cy="353.5" r="7" fill="#fff" stroke="#284b38" stroke-width="2"/><circle cx="557.4" cy="353.5" r="2.2" fill="#284b38"/></g><circle cx="56" cy="665" r="8" fill="#195640"/><text x="71.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Possession / team A</text><circle cx="296" cy="665" r="8" fill="#b7543d"/><text x="311.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Opposition / team B</text><circle cx="536" cy="665" r="8" fill="#d3a438"/><text x="551.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Neutral / server</text><circle cx="776" cy="665" r="8" fill="#d7ded5"/><text x="791.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Rest / observer</text><path d="M48 698H88" stroke="#236d53" stroke-width="3"/><path d="M95 698L86 693V703Z" fill="#236d53"/><path d="M232 698h8m6 0h8m6 0h8" stroke="#986a15" stroke-width="3"/><path d="M280 698L271 693V703Z" fill="#986a15"/><path d="M424 698H465" stroke="#a34534" stroke-width="3"/><path d="M472 698L463 693V703Z" fill="#a34534"/><text x="105.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Pass</text><text x="290.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Player run</text><text x="482.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Shot / service</text><text x="659.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Orange cones = gate</text><rect x="36" y="725" width="928" height="46" rx="9" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">React together to the new possession picture; neutrals switch immediately.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Two teams of five plus two neutrals retain for five passes = one point.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Picture: B3 intercepts. Nearby A players Hunt with cover or drop Home.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">The team that regains can score in either mini-goal within six seconds for two points.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>