ize="14" text-anchor="start" font-weight="400">Orange cones = gate</text><rect x="36" y="725" width="928" height="46" rx="9" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">Control the braking step before increasing speed or adding an unplanned cut.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">R accelerates through ten yards on the visual cue, then brakes over five yards.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">After regaining balance, read the cue partner and move toward an angled exit gate.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Server passes after the controlled stop; receive and return. Rotate each effort.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>