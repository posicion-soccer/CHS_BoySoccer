<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D23: Acceleration deceleration and a football cue</title><desc id="desc">Setup: groups of four per 25x12 lane: runner, visual cue partner, pass server and observer. Mark a start, a ten-yard acceleration segment, a five-yard braking segment and two angled exit gates. Use flat markers beyond the braking zone. Example: R accelerates through ten yards on the visual cue, then brakes over five yards. After regaining balance, read the cue partner and move toward an angled exit gate. Server passes after the controlled stop; receive and return. Rotate each effort.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D23  ·  Acceleration deceleration and a football cue</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">4 players  ·  25 × 12 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M418.0 135V610" stroke="#9cb58f" stroke-width="2" stroke-dasharray="8 7"/><path d="M582.0 135V610" stroke="#9cb58f" stroke-width="2" stroke-dasharray="8 7"/><path d="M770.5999999999999 225.25L836.1999999999999 282.25" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M763