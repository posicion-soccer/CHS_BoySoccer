<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D9: Wide triangle with a protected counter</title><desc id="desc">Setup: nine players on a 35x25 wide channel beside a full-size goal. Four attackers: fullback, winger, 10 and striker. Four defenders: fullback, winger, center back and pivot. One goalkeeper. Put a mini-goal near halfway for defenders to counter toward. Example: Four attackers face four defenders and a keeper in the wide channel. Example: 2 finds 7; 7 can combine with 10, play 9 or carry inside. Keep one attacker behind the attack; defenders counter to the near mini-goal.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D9  ·  Wide triangle with a protected counter</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">9 players  ·  35 × 25 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M910 234H773V511H910 M910 310H864V435H910" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="910" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><rect x="74" y="186.0" width="16" height="50" fill="#fff" stroke="#667c65" stroke-width="3"/><text x="68.0" y="259.0" fill="#183c2e" font-size="12" text-anchor="middle" font-weight="400">mini</text><text x="254.0" y="586.2" fill="#62795b" font-size="14" text-anchor="middle" font-weight="600">Hold counter cover</text><path d="M262.2,505.5L521.8421244314966,528.2882500193941" stroke="#236d53" stroke-width="3.5"/><path d="M532.8,529.25L520.4087948431754,533.1816707341133L521.2831130073625,523.2199656718375Z" fill="#236d53"/><circle cx="397.5" cy="508.375" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="397.5" y="512.4" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">1</text><path d="M254.0,477.0L262.3668038138955,473.68388873229753" stroke="#986a15" stroke-width="3.5"/><path d="M268.8743178913698,471.10469107964L277.2411217052653,467.7885798119375" stroke="#986a15" stroke-width="3.5"/><path d="M283.7486357827396,465.20938215928004L292.11543959663516,461.8932708915775" stroke="#986a15" stroke-width="3.5"/><path d="M298.62295367410945,459.31407323892006L306.98975748800495,455.99796197121753" stroke="#986a15" stroke-width="3.5"/><path d="M313.49727156547925,453.4187643185601L321.86407537937475,450.10265305085755" stroke="#986a15" stroke-width="3.5"/><path d="M328.37158945684905,447.52345539820004L336.73839327074455,444.2073441304976" stroke="#986a15" stroke-width="3.5"/><path d="M343.24590734821885,441.62814647784006L351.61271116211435,438.3120352101376" stroke="#986a15" stroke-width="3.5"/><path d="M358.12022523958865,435.7328375574801L366.48702905348415,432.4167262897776" stroke="#986a15" stroke-width="3.5"/><path d="M372.99454313095845,429.8375286371201L381.36134694485395,426.52141736941763" stroke="#986a15" stroke-width="3.5"/><path d="M387.86886102232825,423.9422197167601L396.2356648362238,420.62610844905765" stroke="#986a15" stroke-width="3.5"/><path d="M409.79999999999995,415.25L400.4865456190851,424.31970603132305L396.8019775438601,415.023257349217Z" fill="#986a15"/><circle cx="331.9" cy="437.125" r="11" fill="#fbfcf7" stroke="#986a15"/><text x="331.9" y="441.1" fill="#98