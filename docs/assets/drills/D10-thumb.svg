<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D10: Cutback and complementary arrivals</title><desc id="desc">Setup: eleven players in the final 40x50: two wide servers, three attackers, three defenders, one keeper and two rotating support players at the top. The supports replace wide servers and runners between attacks. Mark a near, central and far reference with flat cones outside the running lanes. Example: Two wide players serve three attackers against three defenders and a keeper; two supports rotate. Near runner threatens the front space; far runner attacks the far-post space. A third player arrives late for the cutback; the near support offers a reset.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D10  ·  Cutback and complementary arrivals</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">11 players  ·  40 × 50 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M910 234H773V511H910 M910 310H864V435H910" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="910" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><path d="M721.4,177.75L729.9263797850526,180.63111918549