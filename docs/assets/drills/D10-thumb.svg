stroke="#986a15" stroke-width="3"/><path d="M280 698L271 693V703Z" fill="#986a15"/><path d="M424 698H465" stroke="#a34534" stroke-width="3"/><path d="M472 698L463 693V703Z" fill="#a34534"/><text x="105.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Pass</text><text x="290.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Player run</text><text x="482.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Shot / service</text><text x="659.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Orange cones = gate</text><rect x="36" y="725" width="928" height="46" rx="9" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">Different arrival times create different finishing lanes.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Two wide players serve three attackers against three defenders and a keeper; two supports rotate.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Near runner threatens the front space; far runner attacks the far-post space.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">A third player arrives late for the cutback; the near support offers a reset.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>