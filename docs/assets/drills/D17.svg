<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D17: First contact and second ball</title><desc id="desc">Setup: ten players in a 30x30 area: two teams of four inside and two outside servers on opposite sides. Place two mini-goals at opposite ends. Mark a central landing corridor without placing cones where players may land. Example: Two teams of four compete; opposite outside servers alternate manageable service. Designated players contest or control first contact; teammates position for the second ball. The team that controls the second ball attacks its mini-goal; reset after the attack.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D17  ·  First contact and second ball</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">10 players  ·  30 × 30 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><rect x="442.59999999999997" y="149.25" width="114.79999999999998" height="446.5" fill="#dbe7ce"/><text x="500.0" y="572.0" fill="#183c2e" font-size="13" text-anchor="middle" font-weight="400">Landing corridor</text><rect x="74" y="347.5" width="16" height="50" fill="#fff" stroke="#667c65" stroke-width="3"/><text x="68.0" y=