<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D3: Six versus three with a central connector</title><desc id="desc">Setup: nine players in an 18x18 square. Five possession players operate around the area and one connector inside; three defend anywhere inside. Place spare balls at the coach. The connector is a possession teammate, not a neutral who switches teams. Example: Five outside teammates connect with one central teammate. Example: find 6 between defenders, then play to a different outside player. Three defenders can win and exit any line. Do not force the central pass.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D3  ·  Six versus three with a central connector</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">9 players  ·  18 × 18 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M163.8,258.5L473.14406869118994,359.5833495254201" stroke="#236d53" stroke-width="3.5"/><path d="M483.59999999999997,363.0L470.64050653830725,364.025440986281L473.746552424289,354.52004888736286Z" fill="#236d53"/><circle cx="323.7" cy="301.75" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="323.7" y="305.8" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">1</text><path d="M565.5999999999999,372.5L825.2067725635179,363.3859410962549" stroke="#236d53" stroke-width="3.5"/><path d="M836.1999999999999,363.0L824.3828160221353,368.4179482124972L824.0319604800854,358.4241050884226Z" fill="#236d53"/><circle cx="700.8999999999999" cy="358.75" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="700.9" y="362.8" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">2</text><path d="M499.99999999999994,353.5L493.3991273304206,347.38211801356056" stroke="#986a15" stroke-width="3.5"/><path d="M488.265115254081,342.623765357441L481.66424258450166,336.5058833710016" stroke="#986a15" stroke-width="3.5"/><path d="M476.53023050816216,331.74753071488203L469.92935783858275,325.62964872844265" stroke="#986a15" stroke-width="3.5"/><path d="M458.99999999999994,315.5L471.1999868852388,319.9900244988196L464.4023402336394,327.3243274650189Z" fill="#986a15"/><g class="player" data-group="A"><circle cx="131.0" cy="253.75" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="131.0" y="258.8" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">A</text></g><g class="player" data-group="A"><circle cx="319.59999999999997" cy="154.0" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="319.6" y="159.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">B</text></g><g class="player" data-group="A"><circle cx="696.8" cy="154.0" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="696.8" y="159.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">C</text></g><g class="player" data-group="A"><circle cx="877.1999999999999" cy="363.0" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="877.2" y="368.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">E</text></g><g class="player" data-group="A"><circle cx="458.99999999999994" cy="591.0" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="459.0" y="596.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">F</text></g><g class="player" data-group="A"><circle cx="524.5999999999999" cy="372.5" r="18" fill="#195640" stroke="#fff" stroke-width="2.5"/><text x="524.6" y="377.5" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">6</text></g><g class="player" data-group="B"><circle cx="319.59999999999997" cy="424.75" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="319.6" y="429.8" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D1</text></g><g class="player" data-group="B"><circle cx="664.0" cy="315.5" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="664.0" y="320.5" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D2</text></g><g class="player" data-group="B"><circle cx="582.0" cy="496.0" r="18" fill="#b7543d" stroke="#fff" stroke-width="2.5"/><text x="582.0" y="501.0" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">D3</text></g><g><circle cx="204.79999999999998" cy="272.75" r="7" fill="#fff" stroke="#284b38" stroke-width="2"/><circle cx="204.79999999999998" cy="272.75" r="2.2" fill="#284b38"/></g><circle cx="56" cy="665" r="8" fill="#195640"/><text x="71.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Possession / team A</text><circle cx="296" cy="665" r="8" fill="#b7543d"/><text x="311.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Opposition / team B</text><circle cx="536" cy="665" r="8" fill="#d3a438"/><text x="551.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Neutral / server</text><circle cx="776" cy="665" r="8" fill="#d7ded5"/><text x="791.0" y="670.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Rest / observer</text><path d="M48 698H88" stroke="#236d53" stroke-width="3"/><path d="M95 698L86 693V703Z" fill="#236d53"/><path d="M232 698h8m6 0h8m6 0h8" stroke="#986a15" stroke-width="3"/><path d="M280 698L271 693V703Z" fill="#986a15"/><path d="M424 698H465" stroke="#a34534" stroke-width="3"/><path d="M472 698L463 693V703Z" fill="#a34534"/><text x="105.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Pass</text><text x="290.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Player run</text><text x="482.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Shot / service</text><text x="659.0" y="703.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Orange cones = gate</text><rect x="36" y="725" width="928" height="46" rx="9" fill="#e6eedb"/><text x="52.0" y="754.0" fill="#183c2e" font-size="17" text-anchor="start" font-weight="600">Move out of cover shadows before calling for the ball.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Five outside teammates connect with one central teammate.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Example: find 6 between defenders, then play to a different outside player.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Three defenders can win and exit any line. Do not force the central pass.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>