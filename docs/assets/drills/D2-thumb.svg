<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D2: Four versus two rondo</title><desc id="desc">Setup: six players in a 12x12 square, four around the outside and two inside. Outside players may move along their edges; defenders work together. One ball, four cones and spares at two corners. Example: Four players keep the ball around two live defenders. Move along your edge to offer two passing angles. Five passes = a point; defenders who win try to exit with control.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D2  ·  Four versus two rondo</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">6 players  ·  12 × 12 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M155.6,348.75L449.4172274441372,183.15096937064115" stroke="#236d53" stroke-width="3.5"/><path d="M458.99999999999994,177.75L451.0010523802593,187.9977722933643L446.09108022513095,179.28616087894366Z" fill="#236d53"/><circle cx="307.29999999999995" cy="254.25" r="11" fill="#fbfcf7" stroke="#236d53"/><text x="307.3" y="258.2" fill="#236d53" font-size="13" text-anchor="middle" font-weight="700">1</text><path d="M541.0,173.0L826.7482808942609,343.122