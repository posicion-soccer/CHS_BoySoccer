s the ball travels; connect to the receiver’s useful foot.</text><text x="48.0" y="800.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">01</text><text x="82.0" y="800.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Four players keep the ball around two live defenders.</text><text x="48.0" y="826.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">02</text><text x="82.0" y="826.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Move along your edge to offer two passing angles.</text><text x="48.0" y="852.0" fill="#688653" font-size="16" text-anchor="start" font-weight="700">03</text><text x="82.0" y="852.0" fill="#183c2e" font-size="14" text-anchor="start" font-weight="400">Five passes = a point; defenders who win try to exit with control.</text><text x="48.0" y="904.0" fill="#6c7d64" font-size="12" text-anchor="start" font-weight="400">POSICIÓN  ·  Schematic positions. Numbered arrows illustrate one action; adapt to the live decision.</text></g></svg>