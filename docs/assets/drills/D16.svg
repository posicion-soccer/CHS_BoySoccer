<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" role="img" aria-labelledby="title desc"><title id="title">D16: Midblock and box defending</title><desc id="desc">Setup: seventeen players across a 60x55 area: one keeper, a defending back four plus midfield four, and eight attackers in a 2-3-3. Put two mini-goals near halfway for defensive counterattacks. The coach starts with one of the attacking two. Example: Eight attackers in a 2-3-3 face a goalkeeper and a connected defending 4-4. As the ball travels wide, midfield and back lines shift together to protect central routes. Defend the service and cutback; after a regain attack either near mini-goal.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D16  ·  Midblock and box defending</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">17 players  ·  60 × 55 yards  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M910 234H773V511H910 M910 310H864V435H910" fill="none" stroke="#b1c2a5" stroke-width="2"/><rect x="910" y="323" width="23" height="100" fill="#fff" stroke="#667c65" stroke-width="3"/><rect x="74" y="205.0" width="16" height="50" fill="#fff" stroke="#667c65" stroke-width="3"/><text x="68.0" y="278.0" fill="#183c2e" fo