<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 70 1000 590" role="img" aria-labelledby="title desc"><title id="title">D24: Position stations with shared tactical goals</title><desc id="desc">Setup: 20 players in four groups of five. Use four areas: A center backs and goalkeeper, 25x20; B pivots and 10, 22x16; C wide triangle, 25x18; D striker and box defending, 25x20. Four spare balls per area. Group players by current needs and rotate station exposure across sessions. Example: A: keeper + center backs play 3v2 to gates. B: pivots + 10 use turn, set and third player. C: wide triangle plays 3v2 with overlap choice. D: striker task is 2v2 plus one server. Four minutes per station, one minute to move; roles change each minute. One coach: use two tasks.</desc><defs><marker id="pass" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#236d53"/></marker><marker id="run" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#986a15"/></marker><marker id="shot" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a34534"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect width="1000" height="920" rx="16" fill="#fbfcf7"/><text x="44.0" y="35.0" fill="#183c2e" font-size="25" text-anchor="start" font-weight="700">D24  ·  Position stations with shared tactical goals</text><text x="44.0" y="67.0" fill="#55705c" font-size="17" text-anchor="start" font-weight="400">20 players  ·  Four stations  ·  starting picture / one example</text><rect x="90" y="135" width="820" height="475" rx="4" fill="#eaf1e1" stroke="#91a98b" stroke-width="2"/><path d="M500 135V610 M90 372H910" stroke="#fbfcf7" stroke-width="12"/><path d="M458.99999999999994 244.25L458.99999999999994 301.25" stroke="#e7a554" stroke-width="3" stroke-dasharray="5 5"/><path d="M451.99999999999